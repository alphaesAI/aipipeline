In Kestra (OSS), secrets defined in flows via `{{ secret('SECRET_NAME') }}` must be set in your `docker-compose.yml` environment (or loaded via `.env_encoded`) using the **`SECRET_` prefix** and **base64-encoded values**.

Below is the consolidated list of all unique secret keys required across all four flows.

---

### Secrets Summary Table

| Flow Secret Name | Environment Variable Name in `docker-compose.yml` | Used In Flow(s) |
| :--- | :--- | :--- |
| `GMAIL_CLIENT_ID` | `SECRET_GMAIL_CLIENT_ID` | `gmail_data_pipeline` |
| `GMAIL_CLIENT_SECRET` | `SECRET_GMAIL_CLIENT_SECRET` | `gmail_data_pipeline` |
| `GMAIL_REFRESH_TOKEN` | `SECRET_GMAIL_REFRESH_TOKEN` | `gmail_data_pipeline` |
| `POSTGRES_HOST` | `SECRET_POSTGRES_HOST` | `health_data_pipeline` |
| `POSTGRES_PORT` | `SECRET_POSTGRES_PORT` | `health_data_pipeline` |
| `POSTGRES_USER` | `SECRET_POSTGRES_USER` | `health_data_pipeline` |
| `POSTGRES_PASSWORD` | `SECRET_POSTGRES_PASSWORD` | `health_data_pipeline` |
| `POSTGRES_DB` | `SECRET_POSTGRES_DB` | `health_data_pipeline` |
| `ES_HOST` | `SECRET_ES_HOST` | `gmail_data_pipeline`, `health_data_pipeline`, `arxiv_full_pipeline` |
| `ES_PORT` | `SECRET_ES_PORT` | `gmail_data_pipeline`, `health_data_pipeline`, `arxiv_full_pipeline` |
| `ES_LOGIN` | `SECRET_ES_LOGIN` | `gmail_data_pipeline`, `health_data_pipeline`, `arxiv_full_pipeline` |
| `ES_PASSWORD` | `SECRET_ES_PASSWORD` | `gmail_data_pipeline`, `health_data_pipeline`, `arxiv_full_pipeline` |
| `OPENAI_API_KEY` | `SECRET_OPENAI_API_KEY` | `wiki` |

---

### Docker Compose Configuration Example

Each secret value must be base64-encoded without line breaks (e.g., `echo -n "my_value" | openssl base64 -A`).

```yaml
version: "3"

services:
  kestra:
    image: kestra/kestra:latest
    environment:
      # Gmail Credentials
      SECRET_GMAIL_CLIENT_ID: <base64_encoded_client_id>
      SECRET_GMAIL_CLIENT_SECRET: <base64_encoded_client_secret>
      SECRET_GMAIL_REFRESH_TOKEN: <base64_encoded_refresh_token>

      # PostgreSQL Credentials
      SECRET_POSTGRES_HOST: <base64_encoded_postgres_host>
      SECRET_POSTGRES_PORT: <base64_encoded_postgres_port>
      SECRET_POSTGRES_USER: <base64_encoded_postgres_user>
      SECRET_POSTGRES_PASSWORD: <base64_encoded_postgres_password>
      SECRET_POSTGRES_DB: <base64_encoded_postgres_db>

      # Elasticsearch Credentials
      SECRET_ES_HOST: <base64_encoded_es_host>
      SECRET_ES_PORT: <base64_encoded_es_port>
      SECRET_ES_LOGIN: <base64_encoded_es_login>
      SECRET_ES_PASSWORD: <base64_encoded_es_password>

      # OpenAI Credentials
      SECRET_OPENAI_API_KEY: <base64_encoded_openai_api_key>
```

Alternatively, you can place these in a `.env_encoded` file and reference `env_file: [.env_encoded]` under the Kestra service in `docker-compose.yml`.

