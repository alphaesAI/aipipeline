id: filenest
namespace: default
description: "FileNest pipeline: checks fhir-staging for pending records and processes PDF medical files across granular production tasks"

inputs:
  - id: fhir_staging_base_url
    type: STRING
    defaults: "{{ kv('FHIR_STAGING_BASE_URL') }}"
    description: "Base URL for fhir-staging service"

  - id: filenest_api_url
    type: STRING
    defaults: "{{ kv('FILENEST_API_URL') }}"
    description: "Base URL for FileNest service"

  - id: filenest_api_key
    type: STRING
    defaults: "{{ kv('FILENEST_API_KEY') }}"
    description: "FileNest API Key"

  - id: filenest_project_id
    type: STRING
    defaults: "{{ kv('FILENEST_PROJECT_ID') }}"
    description: "FileNest Project ID"

  - id: openai_api_key
    type: STRING
    defaults: "{{ kv('OPENAI_API_KEY') }}"
    description: "OpenAI API Key (optional override; falls back to environment)"

triggers:
  - id: schedule_check_pending
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"

tasks:
  - id: fetch_pending_records
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.fhir_staging_base_url }}/api/v1/staging-records/?status=pending"
    method: GET
    contentType: application/json
    options:
      allowFailed: true

  # -------------------------------------------------------------------------
  # 2. Extract and filter PDF records
  # -------------------------------------------------------------------------
  - id: filter_pending_pdf_records
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      pending_response.json: "{{ outputs.fetch_pending_records.body }}"
    script: |
      import json
      from kestra import Kestra

      with open("pending_response.json", "r", encoding="utf-8") as f:
          content = f.read().strip()
          try:
              data = json.loads(content) if content else {}
          except Exception:
              data = {}

      records = data.get("data", []) if isinstance(data, dict) else []
      pdf_records = []
      for r in records:
          staging_id = r.get("staging_record_id") or r.get("id")
          file_id = r.get("file_id")
          filename = r.get("attachment_title") or file_id or "document.pdf"
          content_type = (r.get("attachment_content_type") or r.get("content_type") or "").lower()

          # Only include PDF records
          is_pdf = filename.lower().endswith(".pdf") or "pdf" in content_type
          if staging_id and file_id and is_pdf:
              pdf_records.append({
                  "staging_record_id": staging_id,
                  "file_id": file_id,
                  "filename": filename if filename.lower().endswith(".pdf") else f"{filename}.pdf",
                  "patient_id": r.get("patient_id"),
                  "encounter_id": r.get("encounter_id"),
                  "service_request_id": r.get("service_request_id"),
              })

      print(f"Total pending: {len(records)}, PDF pending: {len(pdf_records)}")
      Kestra.outputs({"pdf_records": pdf_records, "has_records": len(pdf_records) > 0})

  # -------------------------------------------------------------------------
  # 3. Iterate through each pending PDF record
  # -------------------------------------------------------------------------
  - id: process_each_pdf
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ outputs.filter_pending_pdf_records.vars.pdf_records }}"
    tasks:
      # Step A: Update status to 'processing'
      - id: update_status_to_processing
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.fhir_staging_base_url }}/api/v1/staging-records/{{ item.staging_record_id }}"
        method: PATCH
        contentType: application/json
        body: |
          {
            "status": "processing",
            "updated_by": "kestra-filenest"
          }

      # Step B: Retrieve staging record and download file from FileNest
      - id: download_filenest_file
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          FHIR_STAGING_BASE_URL: "{{ inputs.fhir_staging_base_url }}"
          FILENEST_API_KEY: "{{ inputs.filenest_api_key }}"
          FILENEST_PROJECT_ID: "{{ inputs.filenest_project_id }}"
          FILENEST_API_URL: "{{ inputs.filenest_api_url }}"
        script: |
          import os
          import sys
          from pathlib import Path
          from kestra import Kestra

          AI_PLATFORM = Path("/home/logidhasan/data/github/drgodly/aipipeline")
          if str(AI_PLATFORM) not in sys.path:
              sys.path.insert(0, str(AI_PLATFORM))

          from src.components.connectors.factory import ConnectorFactory
          from src.components.extractors.factory import ExtractorFactory
          from src.components.fhir_staging.client import FhirStagingClient

          staging_base_url = os.getenv("FHIR_STAGING_BASE_URL") or "{{ inputs.fhir_staging_base_url }}"
          staging_record_id = int("{{ item.staging_record_id }}")

          # 1. Retrieve the record details and file handle from fhir-staging
          with FhirStagingClient(base_url=staging_base_url) as staging_client:
              record_details = staging_client.get_staging_record(staging_record_id)

          file_id = record_details.get("file_id") or "{{ item.file_id }}"
          filename = (
              record_details.get("attachment_title")
              or record_details.get("filename")
              or "{{ item.filename }}"
              or f"{file_id}.pdf"
          )
          if not filename.lower().endswith(".pdf"):
              filename = f"{filename}.pdf"

          print(f"Retrieved staging record {staging_record_id}: file_id={file_id}, filename={filename}")

          # 2. Download from FileNest using the retrieved file handle
          filenest_conn = ConnectorFactory.get_connector(
              "filenest",
              {
                  "api_key": "{{ inputs.filenest_api_key }}",
                  "project_id": "{{ inputs.filenest_project_id }}",
                  "base_url": "{{ inputs.filenest_api_url }}",
              },
          )

          download_dir = AI_PLATFORM / "storage" / "temp"
          download_dir.mkdir(parents=True, exist_ok=True)

          downloader = ExtractorFactory.get_extractor(
              "filenest",
              connection=filenest_conn,
              config={"download_dir": str(download_dir)},
          )

          local_path = downloader.download_to_temp(
              file_id,
              filename=filename,
          )
          print(f"Downloaded: {local_path}")
          Kestra.outputs({
              "local_path": str(local_path),
              "file_id": file_id,
              "filename": filename,
          })

      # Step C: Extract text & structure from PDF
      - id: extract_pdf_content
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import sys
          from pathlib import Path
          from kestra import Kestra

          AI_PLATFORM = Path("/home/logidhasan/data/github/drgodly/aipipeline")
          if str(AI_PLATFORM) not in sys.path:
              sys.path.insert(0, str(AI_PLATFORM))

          from src.components.extractors.factory import ExtractorFactory
          from src.components.utils.config import PipelineConfig

          settings = PipelineConfig()
          extractor = ExtractorFactory.get_extractor(
              "pdf",
              config=settings.get_extractor_config(),
          )

          extracted = extractor.extract("{{ outputs.download_filenest_file.vars.local_path }}")
          print(f"Extracted {len(extracted.markdown)} characters")
          Kestra.outputs({
              "markdown": extracted.markdown,
              "image_count": len(extracted.images),
          })

      # Step D: Classify the medical document report type
      - id: classify_document
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          OPENAI_API_KEY: "{{ inputs.openai_api_key }}"
        script: |
          import asyncio
          import os
          import sys
          from pathlib import Path
          from kestra import Kestra

          AI_PLATFORM = Path("/home/logidhasan/data/github/drgodly/aipipeline")
          if str(AI_PLATFORM) not in sys.path:
              sys.path.insert(0, str(AI_PLATFORM))

          from src.components.transformers.factory import TransformerFactory
          from src.components.utils.config import PipelineConfig

          api_key = os.getenv("OPENAI_API_KEY") or PipelineConfig().OPENAI_API_KEY
          classifier = TransformerFactory.get_transformer(
              "medical_classifier",
              config={"api_key": api_key, "model": "gpt-4o-mini"},
          )

          markdown = """{{ outputs.extract_pdf_content.vars.markdown }}"""
          report_type = asyncio.run(classifier.classify(markdown))
          print(f"Report classified as: {report_type}")
          Kestra.outputs({"report_type": report_type})

      # Step E: Transform clinical markdown to Clinical Domain Model JSON
      - id: transform_clinical_domain
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          OPENAI_API_KEY: "{{ inputs.openai_api_key }}"
        outputFiles:
          - clinical_document.json
        script: |
          import asyncio
          import json
          import os
          import sys
          from pathlib import Path
          from kestra import Kestra

          AI_PLATFORM = Path("/home/logidhasan/data/github/drgodly/aipipeline")
          if str(AI_PLATFORM) not in sys.path:
              sys.path.insert(0, str(AI_PLATFORM))

          from src.components.transformers.factory import TransformerFactory
          from src.components.fhir_staging.mapper import StagingObservationMapper
          from src.components.utils.config import PipelineConfig

          settings = PipelineConfig()
          api_key = os.getenv("OPENAI_API_KEY") or settings.OPENAI_API_KEY

          transformer_config = settings.get_transformer_config()
          transformer_config["api_key"] = api_key
          transformer = TransformerFactory.get_transformer("medical", config=transformer_config)

          markdown = """{{ outputs.extract_pdf_content.vars.markdown }}"""
          document = asyncio.run(transformer.transform(markdown, dicom_metadata=None))
          document["report_type"] = "{{ outputs.classify_document.vars.report_type }}"
          document["source_file"] = "{{ item.filename }}"
          document["filenest_file_id"] = "{{ item.file_id }}"
          document["patient_id"] = "{{ item.patient_id }}"

          # Persist to destination storage
          out_dir = AI_PLATFORM / "storage" / "emr" / "transformed"
          out_dir.mkdir(parents=True, exist_ok=True)
          file_id_short = "{{ item.file_id }}"[:8] if "{{ item.file_id }}" else "unknown"
          out_path = out_dir / f"{Path('{{ item.filename }}').stem}_{file_id_short}.json"

          doc_json = json.dumps(document, indent=2, ensure_ascii=False, default=str)
          out_path.write_text(doc_json, encoding="utf-8")

          with open("clinical_document.json", "w", encoding="utf-8") as f:
              f.write(doc_json)

          mapper = StagingObservationMapper()
          mapped_observations = [
              mapper.map(obs) for obs in document.get("observations", []) if isinstance(obs, dict)
          ]

          print(f"Persisted to {out_path} with {len(mapped_observations)} observations")
          Kestra.outputs({
              "output_path": str(out_path),
              "summary": document.get("summary", ""),
              "observations": mapped_observations,
          })

      # Step F: Patch staging record to 'completed' with observations and summary
      - id: patch_staging_completed
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.fhir_staging_base_url }}/api/v1/staging-records/{{ item.staging_record_id }}"
        method: PATCH
        contentType: application/json
        body: |
          {
            "status": "completed",
            "updated_by": "kestra-filenest",
            "summary": "{{ outputs.transform_clinical_domain.vars.summary }}",
            "observations": {{ json(outputs.transform_clinical_domain.vars.observations) }}
          }

      # Step G: Clean up temporary downloaded file
      - id: cleanup_temp_file
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - "rm -f '{{ outputs.download_filenest_file.vars.local_path }}'"